[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hub-crm-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.15,<2", "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable Supabase/PostgreSQL test database"]
