name: Hourly company enrichment

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexflow-company-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    # Evaluated before allocating a runner: never spend private-repo compute.
    # Forks and manual runs from other branches must not access the pilot.
    if: >-
      github.repository == 'xamseslb/Nexflow' &&
      github.event.repository.visibility == 'public' &&
      github.ref == 'refs/heads/main' &&
      vars.ENRICHMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          # No Actions cache or artifacts: no added storage billing.
      - name: Install locked Python dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir -r backend/requirements.lock
      - name: Refresh due company records
        working-directory: backend
        env:
          APP_ENV: production
          WORKER_DATABASE_URL: ${{ secrets.WORKER_DATABASE_URL }}
          PYTHONUNBUFFERED: '1'
        # A batch checks time between jobs; timeout is the hard upper bound.
        # Never use --lookup here: it prints company facts into public logs.
        run: timeout --signal=TERM --kill-after=10s 180s python -m app.worker --batch --max-jobs 20 --max-seconds 120
