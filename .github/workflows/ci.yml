name: Hub CRM checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: hub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/hub_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test-only-password@localhost:5432/hub_test
      PGPASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.lock && pip install --no-deps -e backend
      - run: psql -h localhost -U postgres -d hub_test -v ON_ERROR_STOP=1 -f backend/tests/bootstrap_postgres.sql
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSER: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
      - run: npm run test:pwa --workspace frontend
